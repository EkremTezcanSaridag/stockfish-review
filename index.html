<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stockfish Oyun Analizi - Ücretsiz Satranç Analizi</title>
    <link rel="stylesheet" href="./style.css?v=d2c14a6">
</head>
<body>
    <div id="app">
        <header class="app-header">
            <div class="container">
                <h1>Stockfish Oyun Analizi</h1>
                <p class="subtitle">Ücretsiz profesyonel satranç analizi</p>
            </div>
        </header>

        <main class="container">
            <div id="input-section" class="card">
                <h2>Oyun Yükle</h2>
                
                <div class="input-area">
                    <textarea id="pgn-input" 
                              placeholder="PGN formatında oyununuzu buraya yapıştırın...&#10;&#10;Örnek:&#10;[Event &quot;Casual Game&quot;]&#10;&#10;1. e4 e5 2. Nf3 Nc6 3. Bb5..."></textarea>
                    
                    <div class="button-group">
                        <button id="sample-btn" class="btn btn-secondary">
                            <span>Örnek Oyun Yükle</span>
                        </button>
                        <button id="clear-btn" class="btn btn-secondary">
                            <span>Temizle</span>
                        </button>
                    </div>
                </div>

                <div class="options-row">
                    <label class="depth-label">
                        <span>Analiz Derinliği:</span>
                        <select id="depth-select">
                            <option value="10">10 (Çok Hızlı)</option>
                            <option value="12">12 (Hızlı)</option>
                            <option value="15" selected>15 (Dengeli - Önerilen)</option>
                            <option value="18">18 (Derin)</option>
                            <option value="20">20 (Çok Derin)</option>
                        </select>
                    </label>
                </div>

                <div class="action-row">
                    <button id="analyze-btn" class="btn btn-primary">
                        <span>Analiz Et</span>
                    </button>
                    <button id="cancel-btn" class="btn btn-danger" style="display: none;">
                        <span>İptal Et</span>
                    </button>
                </div>

                <div id="chess-com-note" class="info-note">
                    <strong>Chess.com kullanıcıları için:</strong> Oyununuzu Chess.com'da açın, 
                    "Share" → "PGN" ile kopyalayın ve yukarıya yapıştırın.
                </div>
            </div>

            <div id="loading-section" class="card" style="display: none;">
                <div class="loading-content">
                    <div class="spinner"></div>
                    <h3 id="loading-text">Hazırlanıyor...</h3>
                    <div class="progress-container">
                        <div class="progress-bar">
                            <div id="progress-fill" class="progress-fill"></div>
                        </div>
                        <span id="progress-text" class="progress-text">0%</span>
                    </div>
                </div>
            </div>

            <div id="results-section" style="display: none;">
                <!-- Full-width summary bar at top -->
                <div class="summary-bar" id="game-summary">
                    <div id="summary-content"></div>
                </div>
                
                <!-- Main analysis grid below -->
                <div class="results-grid">
                    <div class="board-column">
                        <div class="card board-card">
                            <div id="board-wrapper">
                                <div id="board"></div>
                            </div>
                            <div class="board-controls">
                                <button id="start-btn" class="control-btn" title="Başa dön">⏮</button>
                                <button id="prev-btn" class="control-btn" title="Önceki hamle">◀</button>
                                <button id="next-btn" class="control-btn" title="Sonraki hamle">▶</button>
                                <button id="end-btn" class="control-btn" title="Sona git">⏭</button>
                            </div>
                            <div id="position-info" class="position-info"></div>
                        </div>
                    </div>

                    <div class="analysis-column">
                        <div class="card accuracy-card">
                            <h2>Doğruluk</h2>
                            <div class="accuracy-grid">
                                <div class="accuracy-item">
                                    <span class="player-label">Beyaz</span>
                                    <span class="accuracy-value" id="white-accuracy">-%</span>
                                </div>
                                <div class="accuracy-item">
                                    <span class="player-label">Siyah</span>
                                    <span class="accuracy-value" id="black-accuracy">-%</span>
                                </div>
                            </div>
                        </div>

                        <div class="card coach-card">
                            <h2>💬 Hoca</h2>
                            <div id="coach-panel" class="coach-content">
                                Bir hamle seç veya analizi başlat.
                            </div>
                        </div>

                        <div class="card moves-card">
                            <h2>Hamleler</h2>
                            <div class="eval-bar-container">
                                <div id="eval-bar" class="eval-bar" data-eval="0.0"></div>
                            </div>
                            <div id="moves-list" class="moves-list"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <div id="toast-container"></div>
    </div>

    <!-- Load our app as ES module (no jQuery or external board dependencies) -->
    <script type="module" src="./main.js?v=d2c14a6"></script>
</body>
</html>
