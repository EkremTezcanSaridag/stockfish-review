name: Note - Static Deployment

# This app deploys as static files from the main branch root.
# No build step needed - the files work directly.
#
# To enable GitHub Pages:
# 1. Go to Settings → Pages
# 2. Under "Source", select "Deploy from a branch"
# 3. Select branch: main
# 4. Select folder: / (root)
# 5. Click Save
#
# Your site will be live at: https://<username>.github.io/<repo-name>/
#
# This workflow file is for reference only and is not used.
